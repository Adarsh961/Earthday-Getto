<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth Day Challenge — Sustainable Fashion</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ───── HERO BANNER (Landing Page Only) ───── -->
  <section id="hero">
    <div class="hero-bg-grid"></div>
    <div class="hero-logo"> 
      <img src="https://raw.githubusercontent.com/Adarsh961/Earthday-Getto/main/getto_full-transparent_bg.png" alt="Getto" class="logo-img" />
    </div>
    <div class="hero-content">
      <span class="badge">🌍 Earth Day Challenge</span>
      <h1>Can You Spot<br/><em>Truly Sustainable</em><br/>Fashion?</h1>
      <p class="hero-sub">Three rounds. Every right pick grows your tree and your discount.</p>
      <div class="discount-trail">
        <div class="trail-step">Round 1 → <strong>10% off</strong></div>
        <div class="trail-arrow">→</div>
        <div class="trail-step">Round 2 → <strong>20% off</strong></div>
        <div class="trail-arrow">→</div>
        <div class="trail-step">Round 3 → <strong>40% off</strong></div>
      </div>
      <!-- Opens game in a NEW tab — closing that tab ends the game permanently -->
      <a href="game.html" class="cta-btn">Start the Challenge →</a>
    </div>
    <div class="hero-tree-preview">
      <div class="seed-icon">🌱</div>
    </div>
  </section>

</body>
</html>
